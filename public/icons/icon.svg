<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="4" />

  <!-- Background Glow Aura -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" fill-opacity="0.25" filter="url(#glow)" />

  <!-- Behind Card (Rotated slightly) -->
  <rect x="136" y="110" width="220" height="280" rx="32" transform="rotate(-12 246 250)" fill="url(#cardGrad1)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="3" />

  <!-- Main Card -->
  <rect x="156" y="126" width="220" height="280" rx="32" transform="rotate(6 266 266)" fill="url(#cardGrad2)" stroke="#c084fc" stroke-opacity="0.6" stroke-width="4" filter="url(#glow)" />

  <!-- Center Modern Sparkle / Brain-Bolt Logo -->
  <g transform="translate(186, 176) scale(0.65)">
    <!-- Electric Spaced Repetition Bolt -->
    <path d="M120 10 L40 130 L110 130 L80 240 L180 100 L110 100 Z" fill="url(#boltGrad)" filter="url(#glow)" />
  </g>

  <!-- Card Lines (Front representation) -->
  <line x1="190" y1="330" x2="310" y2="342" stroke="#ffffff" stroke-opacity="0.8" stroke-width="7" stroke-linecap="round" />
  <line x1="195" y1="355" x2="270" y2="363" stroke="#ffffff" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round" />
</svg>
